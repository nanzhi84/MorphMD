<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- 1. 外层暖纸 Squircle 主背景渐变 (#FAF9F5 -> #EAE2D2) -->
    <linearGradient id="warmPaperBg" x1="64" y1="38" x2="448" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="55%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EAE2D2"/>
    </linearGradient>

    <!-- 2. 深炭墨色线条渐变 (#262522 -> #141413) -->
    <linearGradient id="inkStrokeGrad" x1="104" y1="128" x2="396" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#262522"/>
      <stop offset="100%" stop-color="#141413"/>
    </linearGradient>

    <!-- 3. 赤陶色星芒与书卷竖条渐变 (#EE9070 -> #D97757 -> #C05A39) -->
    <linearGradient id="terracottaGrad" x1="156" y1="96" x2="412" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EE9070"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#C05A39"/>
    </linearGradient>

    <!-- 外层 Squircle 柔和投影 -->
    <filter id="squircleShadow" x="16" y="20" width="480" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141413" flood-opacity="0.11"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.06"/>
    </filter>

    <!-- 中心图标柔和立体投影 -->
    <filter id="motifShadow" x="72" y="72" width="376" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#141413" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- 1. 暖纸圆角矩形底座 (Warm Paper Squircle) -->
  <g filter="url(#squircleShadow)">
    <rect x="38" y="38" width="436" height="436" rx="98" fill="url(#warmPaperBg)"/>
    <rect x="40" y="40" width="432" height="432" rx="96" stroke="#DFD8C8" stroke-width="4"/>
    <rect x="43" y="43" width="426" height="426" rx="93" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="2"/>
  </g>

  <!-- 2. 核心图形 (一源多态 MorphMD 构图: 后景多态层叠卡 + 前景主原稿框 + 左侧赤陶书卷竖线 + 标题正文双横线 + 右上赤陶星芒 ✦) -->
  <g filter="url(#motifShadow)">
    <!-- 后景多态发布画布层 (象征公众号 / X 长文 / 社交卡片多目标衍生) -->
    <path d="M 328 242 H 362 C 383 242 400 259 400 280 V 352 C 400 373 383 390 362 390 H 238 C 221 390 207 378 203 362"
          stroke="url(#terracottaGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

    <!-- 前景 Markdown 原稿主画框 (右上开口迎接星芒, #141413 深炭墨色 24px 圆头线条) -->
    <path d="M 262 138 H 154 C 126.386 138 104 160.386 104 188 V 302 C 104 329.614 126.386 352 154 352 H 304 C 331.614 352 354 329.614 354 302 V 248"
          stroke="url(#inkStrokeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 原稿内左侧书卷引用竖线 (Anthropic Terracotta #D97757) -->
    <line x1="158" y1="196" x2="158" y2="294"
          stroke="url(#terracottaGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- 原稿内右侧排版双横线 (上短标题 下长正文, 深炭墨色 #181816) -->
    <line x1="204" y1="216" x2="266" y2="216"
          stroke="#181816" stroke-width="22" stroke-linecap="round"/>
    <line x1="204" y1="274" x2="300" y2="274"
          stroke="#181816" stroke-width="22" stroke-linecap="round"/>

    <!-- 右上角标志性赤陶色四角星芒 ✦ (#D97757) -->
    <path d="M 350 96 C 350 144 367 161 415 163 C 367 165 350 182 350 230 C 350 182 333 165 285 163 C 333 161 350 144 350 96 Z"
          fill="url(#terracottaGrad)"/>
  </g>
</svg>
